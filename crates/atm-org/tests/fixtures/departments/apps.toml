# Department "apps". Draft D0 by agent-tmux-manager/departments-lead, 2026-11-21; owner's yes 10:28
# ("Sounds awesome let's make it happen" = defaults on cp-s2-dept-1). The file name is the id.
# Departments and projects are separate and many-to-many (owner, 16 Nov 20:49): this file names its
# projects; no project names a department; ids and manager lines are unchanged.
# Roster: a seat id, or `project/prefix*` where * is one or more digits (numbered copies of one job
# description); `max` = live seats at once. Rosters start as today's role files.
# Models: exact role-file `model` strings, or a trailing * for any rest.
# Nothing here is enforced until D2/D3; hiring stays in report mode until the owner says "enforce".

